name: auto-social-post

on:
  push:
    branches: [main]
    paths:
      - 'products.js'
      - 'product-*.html'
      - 'images/**'
  workflow_dispatch:
    inputs:
      product_id:
        description: 'Force-post a product id (e.g. 7). Leave empty to post anything new.'
        required: false
        type: string
      facebook:
        description: 'Enable Facebook post'
        required: false
        default: true
        type: boolean
      instagram:
        description: 'Enable Instagram post'
        required: false
        default: true
        type: boolean
      pinterest:
        description: 'Enable Pinterest pin'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-social-post
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for pages deploy + images to be live
        run: node scripts/social-poster.js --wait-images

      - name: Run auto cross-poster
        run: node scripts/social-poster.js ${{ inputs.product_id }}

      - name: Commit post state (dedupe tracker)
        run: |
          git config user.name "auto-social-post"
          git config user.email "actions@users.noreply.github.com"
          git add .github/social-state.json
          git diff --cached --quiet || git commit -m "chore: update social post state"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
