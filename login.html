<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="description" content="Log in to your M Ashraf Shoes account to see your saved cart and order history.">

<link rel="canonical" href="https://mashrafshoes.store/login">
<meta property="og:type" content="website">
<meta property="og:title" content="Login — M Ashraf Shoes">
<meta property="og:description" content="Log in to see your cart, orders and account.">
<meta property="og:url" content="https://mashrafshoes.store/login">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Login — M Ashraf Shoes</title>
<style>
  :root{
    --bg:#FBFAF7; --white:#FFFFFF; --ink:#1A1A18;
    --ink-soft:rgba(26,26,24,0.68); --ink-faint:rgba(26,26,24,0.62);
    --accent:#1B5E43; --accent-deep:#13452f; --line:rgba(26,26,24,0.10);
    --sale:#A13A2E; --radius:14px;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }

  header{
    background:rgba(251,250,247,0.85); backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line); padding:16px 5vw;
    display:flex; align-items:center; justify-content:space-between;
  }
  header .brand{ text-decoration:none; font-family:var(--serif); font-weight:700; font-size:17px; }
  header .brand em{ font-style:normal; color:var(--accent); }
  header .back{ font-size:13px; color:var(--ink-soft); text-decoration:none; font-weight:600; }
  header .back:hover{ color:var(--ink); }

  main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:48px 20px; }
  .card{
    width:100%; max-width:400px; background:var(--white);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:36px 28px; box-shadow:0 10px 40px rgba(0,0,0,0.05);
  }
  .card h1{ font-family:var(--serif); font-weight:400; font-size:26px; text-align:center; margin-bottom:6px; }
  .card .sub{ font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:24px; }

  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:12px;
    padding:0 16px; height:48px; border:1.5px solid #747775; border-radius:20px; background:#fff;
    font-size:15px; font-weight:500; font-family:var(--sans); color:#1F1F1F; cursor:pointer;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .google-btn:hover{ background:#f8faf9; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
  .google-btn svg{ width:20px; height:20px; flex-shrink:0; }

  .divider{
    display:flex; align-items:center; gap:12px; margin:22px 0;
    color:var(--ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-size:14px; font-family:inherit; background:var(--bg); transition:border-color .2s ease;
  }
  input:focus{ outline:none; border-color:var(--accent); background:#fff; }

  .row{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:12.5px; }
  .row label{ margin:0; display:inline-flex; align-items:center; gap:6px; font-weight:500; }
  .row input[type=checkbox]{ width:auto; }
  .forgot{ color:var(--accent); text-decoration:none; font-weight:600; }
  .forgot:hover{ text-decoration:underline; }

  .btn{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:999px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .btn:hover{ background:var(--accent-deep); transform:translateY(-1px); }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .switch{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:20px; }
  .switch a{ color:var(--accent); font-weight:700; text-decoration:none; }
  .switch a:hover{ text-decoration:underline; }

  .msg{ margin-top:16px; font-size:13px; text-align:center; display:none; }
  .msg.error{ color:var(--sale); }
  .msg.ok{ color:var(--accent); }
  .msg.show{ display:block; }

  footer{ text-align:center; padding:24px 20px; font-size:12px; color:var(--ink-faint); }
</style>
</head>
<body>

<header>
  <a href="index" class="brand">M Ashraf <em>Shoes</em></a>
  <a href="index" class="back">← Back to shop</a>
</header>

<main>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your cart, orders and account.</p>

    <button type="button" class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Sign in with Google
    </button>

    <div class="divider">or with email</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">

      <div class="row">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#" class="forgot" onclick="handleForgot(event)">Forgot password?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">Log In</button>
    </form>

    <div class="msg" id="msg"></div>

    <p class="switch">New here? <a href="signup">Create an account</a></p>
  </div>
</main>

<footer><a href="sitemap" style="color:inherit;text-decoration:underline">All Products</a> &middot; © M Ashraf Shoes Pakistan — Cash on Delivery · Nationwide Shipping</footer>

<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
<script>
  (function(){
    var msg = document.getElementById('msg');

    function showMsg(text, isError){
      msg.textContent = text;
      msg.className = 'msg show ' + (isError ? 'error' : 'ok');
    }

    function redirectIfLoggedIn(){
      if(window.SupabaseStore){
        window.SupabaseStore.getUser().then(function(user){
          if(user) window.location.href = 'account ';
        }).catch(function(){});
      }
    }

    // If already logged in, go straight to the account page.
    redirectIfLoggedIn();

    // If Supabase isn't configured, explain what to do.
    if(!window.SupabaseStore || !window.SupabaseStore.isConfigured()){
      document.getElementById('googleBtn').disabled = true;
      document.getElementById('submitBtn').disabled = true;
      showMsg('Account login needs the Supabase setup — see SETUP-SUPABASE.md, then come back here.', true);
    }

    document.getElementById('googleBtn').addEventListener('click', function(){
      window.SupabaseStore.signInWithGoogle().catch(function(err){
        showMsg('Google login failed: ' + (err.message || err), true);
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      msg.className = 'msg';

      try{
        var res = await window.SupabaseStore.signIn(email, password);
        if(res.error){
          showMsg(res.error.message || 'Login failed. Please try again.', true);
        }else{
          showMsg('Logged in! Taking you to your account…');
          setTimeout(function(){ window.location.href = 'account '; }, 700);
        }
      }catch(err){
        showMsg('Something went wrong — please try again.', true);
      }finally{
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });

    window.handleForgot = function(e){
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if(!email){
        showMsg('Enter your email above first, then click Forgot password.', true);
        return;
      }
      window.SupabaseStore.getClient().then(function(client){
        if(!client){
          showMsg('Password reset needs Supabase configured.', true);
          return;
        }
        client.auth.resetPasswordForEmail(email).then(function(res){
          if(res.error){
            showMsg(res.error.message, true);
          }else{
            showMsg('Reset link sent to ' + email + ' — check your inbox.', false);
          }
        });
      });
    };
  })();
</script>

   style="position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--accent,#1B5E43);color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);"
   aria-label="View Cart">

</a>

</body>
</html>
