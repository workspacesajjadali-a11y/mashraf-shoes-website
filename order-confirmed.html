<style>
  :root{
    --bg:#FBFAF7; --white:#FFFFFF; --ink:#1A1A18;
    --ink-soft:rgba(26,26,24,0.68); --ink-faint:rgba(26,26,24,0.62);
    --accent:#1B5E43; --accent-deep:#13452f; --line:rgba(26,26,24,0.10);
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    text-align:center; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:40px 6vw;
  }
  .check-wrap{
    width:72px; height:72px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; margin-bottom:24px;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  .check-wrap svg{ width:34px; height:34px; stroke:#fff; }
  @keyframes pop{ 0%{ transform:scale(0); } 100%{ transform:scale(1); } }
  h1{ font-family:var(--serif); font-weight:400; font-size:30px; margin-bottom:12px; }
  .order-id{
    display:inline-block; font-size:17px; font-weight:700; color:var(--accent);
    background:rgba(27,94,67,0.10); border-radius:999px; padding:8px 20px; margin-bottom:20px;
  }
  p{ color:var(--ink-soft); font-size:14px; margin-bottom:32px; max-width:420px; line-height:1.7; }
  .btn{
    display:inline-block; text-decoration:none; padding:14px 28px; border-radius:999px;
    font-size:14px; font-weight:600; margin:6px; transition:all .2s ease;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-deep); }
  .btn-outline{ border:1.5px solid var(--ink); color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:#fff; }
</style>
