<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="description" content="Track your M Ashraf Shoes order. Enter your email to see order history and status, or check order status by order ID.">
<meta name="keywords" content="track order, order status, shoe order Pakistan, M Ashraf Shoes orders">
<link rel="canonical" href="https://mashrafshoes.store/track-order.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Track Order — M Ashraf Shoes">
<meta property="og:description" content="Check your order status and order history.">
<meta property="og:url" content="https://mashrafshoes.store/track-order.html">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Track Order & Order History — M Ashraf Shoes</title>
<style>
  :root{
    --bg:#FBFAF7; --white:#FFFFFF; --ink:#1A1A18;
    --ink-soft:rgba(26,26,24,0.68); --ink-faint:rgba(26,26,24,0.62);
    --accent:#1B5E43; --accent-deep:#13452f; --line:rgba(26,26,24,0.10); --sale:#A13A2E;
    --radius:14px; --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--sans); background:var(--bg); color:var(--ink); min-height:100vh; }
  header{
    background:rgba(251,250,247,0.85); backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line); padding:16px 5vw;
  }
  header a{ text-decoration:none; color:var(--ink); font-weight:700; font-size:16px; font-family:var(--serif); }
  header a em{ font-style:normal; color:var(--accent); }
  main{ max-width:520px; margin:0 auto; padding:48px 6vw; text-align:center; }
  h1{ font-family:var(--serif); font-weight:400; font-size:28px; margin-bottom:8px; }
  p.sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:28px; }
  input{
    width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px;
    font-size:15px; text-align:center; margin-bottom:12px; background:var(--white);
    transition:border-color .2s ease;
  }
  input:focus{ outline:none; border-color:var(--accent); }
  button{
    width:100%; padding:14px; background:var(--accent); color:#fff; border:none;
    border-radius:999px; font-size:14px; font-weight:700; cursor:pointer;
    transition:background .2s ease;
  }
  button:hover{ background:var(--accent-deep); }
  .result{
    margin-top:20px; text-align:left; background:var(--white);
    border:1px solid var(--line); border-radius:var(--radius); padding:20px; display:none;
  }
  .result.show{ display:block; }
  .result + .result{ margin-top:12px; }
  .result div{ font-size:13px; margin-bottom:6px; color:var(--ink-soft); }
  .result strong{ color:var(--ink); }
  .order-status{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .order-status span{
    display:inline-block; padding:5px 12px; border-radius:999px;
    background:rgba(27,94,67,0.10); color:var(--accent); font-weight:700; font-size:12px;
  }
  .error{ color:var(--sale); font-size:13px; margin-top:14px; }
  #resultsWrap{ display:flex; flex-direction:column; gap:12px; margin-top:24px; }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
    <a href="index.html">← M Ashraf <em>Shoes</em></a>
    <a href="account.html" style="text-decoration:none; color:var(--ink); display:flex; align-items:center;" aria-label="My Account" title="My Account">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </div>
</header>
<main>
  <h1>Track Order &amp; Order History</h1>
  <p class="sub">
    Enter your Order ID to track one order, or your email to see all your past orders.
  </p>
  <input
    type="text"
    id="searchInput"
    placeholder="Order ID (MAS-1234) or your email"
  >
  <button onclick="search()">Search</button>
  <div class="error" id="errorMsg"></div>
  <div id="resultsWrap"></div>
</main>
<script>
  /* ==============================
     GOOGLE SHEETS / SHEETDB
     ============================== */
  const SHEETDB_ENDPOINT =
    'https://sheetdb.io/api/v1/yzl7r82ebgjdk';
  /* ==============================
     DISPLAY ORDER
     ============================== */
  function renderOrder(order){
    return `
      <div class="result show">
        <div>
          <strong>Order ID:</strong>
          ${order.OrderID || ''}
        </div>
        <div>
          <strong>Date:</strong>
          ${order.Date || ''}
        </div>
        <div>
          <strong>Items:</strong>
          ${order.Product || ''}
        </div>
        <div>
          <strong>Total:</strong>
          Rs. ${order.Price || ''}
        </div>
        <div class="order-status">
          <strong>Status:</strong>
          <span>${order.Status || 'Processing'}</span>
        </div>
      </div>
    `;
  }
  /* ==============================
     SEARCH ORDER
     ============================== */
  async function search(){
    const query =
      document.getElementById('searchInput').value.trim();
    const errorEl =
      document.getElementById('errorMsg');
    const resultsWrap =
      document.getElementById('resultsWrap');
    errorEl.textContent = '';
    resultsWrap.innerHTML = '';
    if(!query){
      errorEl.textContent =
        'Please enter an Order ID or email.';
      return;
    }
    const isEmail = query.includes('@');
    const field = isEmail
      ? 'Email'
      : 'OrderID';
    try{
      const res = await fetch(
        `${SHEETDB_ENDPOINT}/search?${field}=${encodeURIComponent(query)}`
      );
      const data = await res.json();
      if(!data.length){
        errorEl.textContent = isEmail
          ? 'No past orders found for this email.'
          : 'Order not found — please check your Order ID.';
        return;
      }
      data.reverse().forEach(order => {
        resultsWrap.innerHTML +=
          renderOrder(order);
      });
    }catch(err){
      errorEl.textContent =
        'Something went wrong — please try again in a moment.';
    }
  }
</script>

</body>
</html>
