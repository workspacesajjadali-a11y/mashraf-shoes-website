<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Your Cart — M Ashraf Shoes</title>
<style>
  :root{ --accent:#1B5E43; --ink:#1A1A18; --ink-soft:rgba(26,26,24,0.62); --charcoal:#171614; --line:rgba(26,26,24,0.12); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#FAFAF7; color:var(--ink); }
  header{ background:#fff; border-bottom:2px solid var(--accent); padding:16px 5vw; }
  header a{ text-decoration:none; color:var(--ink); font-weight:700; font-size:16px; }
  main{ max-width:600px; margin:0 auto; padding:24px 5vw 100px; }
  h1{ font-size:20px; margin-bottom:20px; }
  .item{
    display:flex; gap:12px; background:#fff; border:2px solid var(--accent); border-radius:8px;
    padding:12px; margin-bottom:12px; align-items:center;
  }
  .item img{ width:70px; height:70px; object-fit:cover; border-radius:4px; }
  .item-info{ flex:1; }
  .item-info .name{ font-size:13px; font-weight:600; margin-bottom:2px; }
  .item-info .meta{ font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
  .qty-row{ display:flex; align-items:center; gap:8px; }
  .qty-row button{ width:26px; height:26px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
  .qty-row span{ font-size:13px; min-width:16px; text-align:center; }
  .item-price{ font-size:14px; font-weight:700; text-align:right; }
  .remove-btn{ background:none; border:none; color:#A13A2E; font-size:11px; cursor:pointer; margin-top:6px; }
  .empty{ text-align:center; padding:60px 0; color:var(--ink-soft); }
  .empty a{ color:var(--accent); }
  .cart-footer{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--accent);
    padding:14px 5vw; display:flex; justify-content:space-between; align-items:center;
  }
  .cart-footer .total{ font-size:16px; font-weight:700; }
  .cart-footer a{
    text-decoration:none; background:var(--charcoal); color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; font-weight:600;
  }
</style>
</head>
<body>

<header><a href="index.html">← M Ashraf Shoes</a></header>

<main>
  <h1>Your Cart</h1>
  <div id="cartItems"></div>
</main>

<script src="cart.js"></script>
<script>
  function render(){
    const cart = getCart();
    const container = document.getElementById('cartItems');
    if(!cart.length){
      container.innerHTML = '<div class="empty">Your cart is empty.<br><a href="index.html">Continue Shopping</a></div>';
      removeFooter();
      return;
    }
    container.innerHTML = cart.map((item, i) => `
      <div class="item">
        <img src="${item.image}" alt="${item.productName}" onerror="this.style.display='none'">
        <div class="item-info">
          <div class="name">${item.productName}</div>
          <div class="meta">${item.color} · Size ${item.size}</div>
          <div class="qty-row">
            <button onclick="updateQty(${i}, -1); render();">−</button>
            <span>${item.qty}</span>
            <button onclick="updateQty(${i}, 1); render();">+</button>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${i}); render();">Remove</button>
        </div>
        <div class="item-price">Rs. ${(item.price * item.qty).toLocaleString()}</div>
      </div>
    `).join('');
    showFooter();
  }

  function showFooter(){
    let footer = document.querySelector('.cart-footer');
    if(!footer){
      footer = document.createElement('div');
      footer.className = 'cart-footer';
      document.body.appendChild(footer);
    }
    footer.innerHTML = `<div class="total">Total: Rs. ${cartTotal().toLocaleString()}</div><a href="checkout.html">Checkout →</a>`;
  }
  function removeFooter(){
    const footer = document.querySelector('.cart-footer');
    if(footer) footer.remove();
  }

  render();
</script>

</body>
</html>
