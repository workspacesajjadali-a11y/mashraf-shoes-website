<!DOCTYPE html>

<title>Your Cart — M Ashraf Shoes</title>
<style>
  :root{
    --bg:#FBFAF7; --white:#FFFFFF; --ink:#1A1A18;
    --ink-soft:rgba(26,26,24,0.68); --ink-faint:rgba(26,26,24,0.62);
    --accent:#1B5E43; --accent-deep:#13452f; --line:rgba(26,26,24,0.10); --sale:#A13A2E;
    --radius:14px; --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:rgba(251,250,247,0.85); backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line); padding:16px 5vw;
  }
  header a{ text-decoration:none; color:var(--ink); font-weight:700; font-size:16px; font-family:var(--serif); }
  header a em{ font-style:normal; color:var(--accent); }
  main{ max-width:640px; margin:0 auto; padding:32px 5vw 120px; width:100%; }
  h1{ font-family:var(--serif); font-weight:400; font-size:28px; margin-bottom:24px; }
  .item{
    display:flex; gap:14px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; align-items:center;
  }
  .item img{ width:76px; height:76px; object-fit:cover; border-radius:10px; }
  .item-info{ flex:1; }
  .item-info .name{ font-size:14px; font-weight:600; margin-bottom:2px; }
  .item-info .meta{ font-size:12px; color:var(--ink-faint); margin-bottom:8px; }
  .qty-row{ display:flex; align-items:center; gap:10px; }
  .qty-row button{
    width:28px; height:28px; border:1px solid var(--line); background:var(--white); border-radius:8px;
    cursor:pointer; font-size:15px; color:var(--ink); transition:border-color .2s ease;
  }
  .qty-row button:hover{ border-color:var(--accent); }
  .qty-row span{ font-size:14px; min-width:18px; text-align:center; }
  .item-price{ font-size:15px; font-weight:700; text-align:right; white-space:nowrap; }
  .remove-btn{ background:none; border:none; color:var(--sale); font-size:12px; cursor:pointer; margin-top:8px; }
  .empty{ text-align:center; padding:80px 0; color:var(--ink-soft); font-size:15px; }
  .empty a{ color:var(--accent); font-weight:600; }
  .cart-footer{
    position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding:14px 5vw;
    display:flex; justify-content:space-between; align-items:center;
  }
  .cart-footer .total{ font-size:16px; font-weight:700; }
  .cart-footer .total span{ color:var(--ink-faint); font-weight:500; font-size:13px; }
  .cart-footer a{
    text-decoration:none; background:var(--accent); color:#fff; padding:12px 26px;
    border-radius:999px; font-size:14px; font-weight:600; transition:background .2s ease;
  }
  .cart-footer a:hover{ background:var(--accent-deep); }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
    <a href="index.html">← M Ashraf <em>Shoes</em></a>
    <a href="account.html" style="text-decoration:none; color:var(--ink); display:flex; align-items:center;" aria-label="My Account" title="My Account">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </div>
</header>

<main>
  <h1>Your Cart</h1>
  <div id="cartItems"></div>
</main>

<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
<script src="cart.js"></script>
<script>
  function render(){
    const cart = getCart();
    const container = document.getElementById('cartItems');
    if(!cart.length){
      container.innerHTML = '<div class="empty">Your cart is empty.<br><br><a href="index.html">Continue Shopping</a></div>';
      removeFooter();
      return;
    }
    container.innerHTML = cart.map((item, i) => `
      <div class="item">
        <img src="${item.image}" alt="${item.productName}" onerror="this.style.display='none'">
        <div class="item-info">
          <div class="name">${item.productName}</div>
          <div class="meta">${item.color} · Size ${item.size}</div>
          <div class="qty-row">
            <button onclick="updateQty(${i}, -1); render();">−</button>
            <span>${item.qty}</span>
            <button onclick="updateQty(${i}, 1); render();">+</button>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${i}); render();">Remove</button>
        </div>
        <div class="item-price">Rs. ${(item.price * item.qty).toLocaleString()}</div>
      </div>
    `).join('');
    showFooter();
  }

  function showFooter(){
    let footer = document.querySelector('.cart-footer');
    if(!footer){
      footer = document.createElement('div');
      footer.className = 'cart-footer';
      document.body.appendChild(footer);
    }
    footer.innerHTML = `<div class="total"><span>Total</span> Rs. ${cartTotal().toLocaleString()}</div><a href="checkout.html">Checkout →</a>`;
  }
  function removeFooter(){
    const footer = document.querySelector('.cart-footer');
    if(footer) footer.remove();
  }

  render();
</script>
