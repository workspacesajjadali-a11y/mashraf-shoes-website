<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Checkout securely at M Ashraf Shoes. Order online with nationwide Cash on Delivery in Pakistan.">

<meta property="og:description" content="Complete your order with nationwide Cash on Delivery.">
<meta property="og:url" content="https://mashrafshoes.store/checkout">

<title>Checkout — M Ashraf Shoes</title>
<style>
  :root{
    color-scheme:light; --bg:#FBFAF7; --white:#FFFFFF; --ink:#1A1A18;
    --ink-soft:rgba(26,26,24,0.68); --ink-faint:rgba(26,26,24,0.62);
    --accent:#1B5E43; --accent-deep:#13452f; --line:rgba(26,26,24,0.10); --sale:#A13A2E;
    --radius:14px; --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink); padding-bottom:40px;
    min-height:100vh;
  }
  header{
    background:rgba(251,250,247,0.85); backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line); padding:16px 5vw;
  }
  header a{ text-decoration:none; color:var(--ink); font-weight:700; font-size:16px; font-family:var(--serif); }
  header a em{ font-style:normal; color:var(--accent); }
  main{ max-width:600px; margin:0 auto; padding:32px 5vw; }
  h1{ font-family:var(--serif); font-weight:400; font-size:28px; margin-bottom:24px; }
  .order-summary{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:28px; }
  .order-summary h2{
    font-size:11px; text-transform:uppercase; letter-spacing:0.16em; color:var(--accent);
    font-weight:700; margin-bottom:12px;
  }
  .cart-item{ display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:9px 0; border-bottom:1px solid var(--line); }
  .cart-item:last-of-type{ border-bottom:none; }
  .cart-total{ display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-top:10px; padding-top:12px; border-top:1.5px solid var(--ink); }
  .empty-cart{ text-align:center; padding:40px 0; color:var(--ink-soft); }
  .empty-cart a{ color:var(--accent); font-weight:600; }

  label{ display:block; font-size:13px; font-weight:600; margin:18px 0 6px; }
  input, select, textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; background:var(--white);
    transition:border-color .2s ease;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  .location-btn{
    margin-top:10px; width:100%; padding:11px; background:transparent; border:1.5px solid var(--accent);
    color:var(--accent); border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .location-btn:hover{ background:var(--accent); color:#fff; }
  .location-status{ font-size:12px; color:var(--ink-soft); margin-top:8px; }

  .payment-options{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .payment-option{
    display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:12px; padding:14px;
    cursor:pointer; background:var(--white); transition:border-color .2s ease, background .2s ease;
  }
  .payment-option.selected{ border-color:var(--accent); background:rgba(27,94,67,0.05); }
  .payment-option.disabled{ opacity:0.5; cursor:not-allowed; }
  .payment-option input{ width:auto; accent-color:var(--accent); }

  .submit-btn{
    width:100%; padding:15px; background:var(--accent); color:#fff; border:none;
    border-radius:999px; font-size:15px; font-weight:700; cursor:pointer; margin-top:28px;
    transition:background .2s ease;
  }
  .submit-btn:hover:not(:disabled){ background:var(--accent-deep); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .note{ font-size:12px; color:var(--ink-faint); margin-top:12px; text-align:center; }
</style>

</head>
<body>

<header>
  <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
    <a href="index">← M Ashraf <em>Shoes</em></a>
    <a href="account" style="text-decoration:none; color:var(--ink); display:flex; align-items:center;" aria-label="My Account" title="My Account">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </div>
</header>

<main>
  <h1>Checkout</h1>

  <div class="order-summary" id="orderSummary"></div>

  <form id="checkoutForm">
    <label>Full Name</label>
    <input type="text" id="custName" required placeholder="Your name">

    <label>Phone Number</label>
    <input type="tel" id="custPhone" required placeholder="03XXXXXXXXX">

    <label>Email Address (optional)</label>
    <input type="email" id="custEmail" placeholder="you@example.com">
    <p style="font-size:11px; color:var(--ink-soft); margin-top:-8px;">Optional — we can send your Order ID here. Your phone number is enough.</p>

    <label>Delivery Address</label>
    <textarea id="custAddress" rows="3" required placeholder="House #, street, area, city"></textarea>
    <button type="button" class="location-btn" onclick="useMyLocation()">📍 Use My Current Location</button>
    <div class="location-status" id="locationStatus"></div>

    <label>Payment Method</label>
    <div class="payment-options">
      <label class="payment-option selected" id="codOption">
        <input type="radio" name="payment" value="COD" checked onclick="selectPayment('COD')">
        Cash on Delivery — delivery charge shown below
      </label>
      <label class="payment-option disabled">
        <input type="radio" name="payment" value="Online" disabled>
        Pay Online — Coming Soon
      </label>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Place Order</button>
    <p class="note">Your order will be confirmed via WhatsApp after you submit.</p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
<script src="cart.js"></script>
<script>

  function getDeliveryCharge(cart){
    if(!cart.length) return 0;

    // Use the delivery charge stored on each cart item (passed from the
    // product page). This correctly handles free-delivery products.
    const charges = cart.map(item => {
      if(Number.isFinite(Number(item.deliveryCharge)) && Number(item.deliveryCharge) >= 0){
        return Number(item.deliveryCharge);
      }
      // Fallback for older carts that have no stored charge.
      if(Number(item.productId) === 6 || Number(item.productId) === 11 ||
         Number(item.productId) === 12 || Number(item.productId) === 13) return 0;
      if(Number(item.productId) === 5) return 150;
      return 250;
    });

    // For mixed carts, use the highest applicable delivery charge so an
    // existing product is never accidentally undercharged.
    return Math.max.apply(null, charges);
  }

  function renderSummary(){
    const cart = getCart();
    const summaryEl = document.getElementById('orderSummary');
    if(!cart.length){
      summaryEl.innerHTML = '<div class="empty-cart">Your cart is empty. <a href="index">Go shopping</a></div>';
      document.getElementById('submitBtn').disabled = true;
      return;
    }
    const itemsHtml = cart.map(item => `
      <div class="cart-item"><span>${item.productName} — ${item.color}, Size ${item.size} × ${item.qty}</span><span>Rs. ${(item.price*item.qty).toLocaleString()}</span></div>
    `).join('');
    const deliveryCharge = getDeliveryCharge(cart); // Product-specific COD delivery charge
    const total = cartTotal() + deliveryCharge;
    summaryEl.innerHTML = `
      <h2>Order Summary</h2>
      ${itemsHtml}
      <div class="cart-item"><span>Delivery Charge</span><span>Rs. ${deliveryCharge}</span></div>
      <div class="cart-total"><span>Total</span><span>Rs. ${total.toLocaleString()}</span></div>
    `;
  }

  function selectPayment(method){
    document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('codOption').classList.add('selected');
  }

  function useMyLocation(){
    const status = document.getElementById('locationStatus');
    if(!navigator.geolocation){
      status.textContent = 'Location not supported on this device — please type your address manually.';
      return;
    }
    status.textContent = 'Getting your location...';
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
        const data = await res.json();
        document.getElementById('custAddress').value = data.display_name || `${latitude}, ${longitude}`;
        status.textContent = 'Location added — please double-check the address is accurate.';
      }catch(e){
        document.getElementById('custAddress').value = `Lat: ${latitude}, Lng: ${longitude}`;
        status.textContent = 'Got coordinates, but could not convert to address — please add details manually.';
      }
    }, () => {
      status.textContent = 'Could not get location — please type your address manually.';
    });
  }

  function generateOrderId(){
    const num = Math.floor(1000 + Math.random() * 9000);
    return 'MAS-' + num;
  }

  let submitting = false;

  document.getElementById('checkoutForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const cart = getCart();
    if(!cart.length) return;
    if(submitting) return; // prevent duplicate orders from double-clicking

    const orderId = generateOrderId();
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const email = document.getElementById('custEmail').value;
    const address = document.getElementById('custAddress').value;
    const deliveryCharge = getDeliveryCharge(cart);
    const subtotal = cartTotal();
    const total = subtotal + deliveryCharge;

    const itemsText = cart.map(i => `${i.productName} (${i.color}, Size ${i.size}) x${i.qty}`).join(', ');

    const SHEETDB_ENDPOINT = 'https://sheetdb.io/api/v1/yzl7r82ebgjdk';
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xeajevvd';

    const EMAILJS_PUBLIC_KEY = 'c7yXvgOghq9a9CwfT';
    const EMAILJS_SERVICE_ID = 'service_52gd5h6';
    const EMAILJS_TEMPLATE_ID = 'template_g7s2238';

    // Lock the form so the order is placed exactly ONCE.
    submitting = true;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Placing your order...';

    // Abort third-party requests if they hang so the order never gets stuck.
    const withTimeout = (ms) => {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), ms);
      return { signal: ctrl.signal };
    };

    // Save order to Supabase (primary database). Silent if not configured yet.
    if (window.SupabaseStore) {
      try{
        await window.SupabaseStore.saveOrder({
          orderId, name, phone, email, address, items: cart, itemsText,
          subtotal, deliveryCharge, total, paymentMethod: 'COD'
        });
      }catch(err){ console.error('Supabase order save failed:', err); }
    }

    // Sheets + owner email + customer email run in PARALLEL and never block
    // the order. A failure in any of them is logged but never loses the order.
    await Promise.allSettled([

      // 1. Write order to Google Sheet (order tracking)
      (async function(){
        try{
          const res = await fetch(SHEETDB_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: [{
              OrderID: orderId, Date: new Date().toLocaleString(), CustomerName: name,
              Phone: phone, Email: email, Address: address, Product: itemsText, Color: '', Size: '',
              Price: subtotal, DeliveryCharge: deliveryCharge, PaymentMethod: 'COD', Status: 'Processing'
            }]}),
            ...withTimeout(8000)
          });
          if(!res.ok) console.error('Sheet logging failed:', res.status);
        }catch(err){ console.error('Sheet logging failed:', err); }
      })(),

      // 2. Notify you (the shop owner) via Formspree
      (async function(){
        try{
          const res = await fetch(FORMSPREE_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, name, phone, email, address, items: itemsText, total }),
            ...withTimeout(8000)
          });
          if(!res.ok) console.error('Owner email notification failed:', res.status);
        }catch(err){ console.error('Owner email notification failed:', err); }
      })(),

      // 3. Send confirmation to the CUSTOMER via EmailJS
      (async function(){
        if(!window.emailjs) return;
        try{
          await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: email, to_name: name, order_id: orderId,
            items: itemsText, total: total
          }, EMAILJS_PUBLIC_KEY);
        }catch(err){ console.error('Customer confirmation email failed:', err); }
      })()
    ]);

    localStorage.removeItem('mashraf_cart');

    // If logged in, also clear the cart saved under their email.
    if(window.SupabaseStore){
      try{
        const u = await window.SupabaseStore.getUser();
        if(u && u.email) await window.SupabaseStore.saveUserCart(u.email, []);
      }catch(err){ console.error('Could not clear saved cart:', err); }
    }

    window.location.href = `order-confirmed?id=${orderId}`;
  });

  renderSummary();

  // If the customer is logged in, pre-fill their email and clear the cart from their account.
  if(window.SupabaseStore){
    window.SupabaseStore.getUser().then(function(user){
      if(user && user.email){
        document.getElementById('custEmail').value = user.email;
      }
    }).catch(function(){});
  }
</script>
